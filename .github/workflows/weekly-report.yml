name: 每周周报自动汇总

# 每周五北京时间 18:13 运行（= UTC 10:13）；用非整点降低被 GitHub 丢弃概率
on:
  schedule:
    - cron: '13 10 * * 5'
  workflow_dispatch: {}   # 也支持在 GitHub 网页上手动点一下立即运行

permissions:
  contents: write          # 允许把生成的 weekly.json 提交回仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 weekly.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python tools/generate_weekly.py

      - name: 提交更新
        run: |
          git config user.name  "iGlobalLaw Bot"
          git config user.email "bot@igloballaw.com"
          if git diff --quiet weekly.json; then
            echo "本周内容无变化，跳过提交。"
          else
            git add weekly.json
            git commit -m "chore: 自动汇总本周周报 $(date -u +%Y-%m-%d)"
            git push
          fi
