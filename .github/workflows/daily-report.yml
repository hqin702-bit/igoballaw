name: 每日日报自动更新

# 每个工作日（周一至周五）北京时间 07:17 运行（= UTC 23:17 前一天）
# 用 :17 这种非整点/半点，避开 GitHub 定时最拥堵的时刻，降低被丢弃概率
on:
  schedule:
    - cron: '17 23 * * 0-4'
  workflow_dispatch: {}   # 也支持在 GitHub 网页上手动点一下立即运行

permissions:
  contents: write          # 允许把生成的 news.json 提交回仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 news.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python tools/generate_news.py

      - name: 提交更新
        run: |
          git config user.name  "iGlobalLaw Bot"
          git config user.email "bot@igloballaw.com"
          if git diff --quiet news.json; then
            echo "今日内容无变化，跳过提交。"
          else
            git add news.json
            git commit -m "chore: 自动更新每日日报 $(date -u +%Y-%m-%d)"
            git push
          fi
